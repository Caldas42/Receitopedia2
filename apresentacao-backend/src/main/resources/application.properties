spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.deserialization.accept-float-as-int=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=27MB
# Descarta o restante do envio rejeitado para entregar a resposta HTTP 413.
server.tomcat.max-swallow-size=${spring.servlet.multipart.max-request-size}
receitopedia.fotos.diretorio=${RECEITOPEDIA_FOTOS_DIR:./dados/fotos}
spring.session.jdbc.initialize-schema=never
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.prefetch=1
