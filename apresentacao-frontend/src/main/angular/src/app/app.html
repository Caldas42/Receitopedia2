<header class="cabecalho-site">
  <nav class="container navegacao" aria-label="Navegação principal">
    <a class="marca" routerLink="/receitas">
      <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
      Receitopédia
    </a>
    @if (sessao.usuario(); as usuario) {
      <ul class="nav me-auto" aria-label="Receitas">
        <li class="nav-item"><a class="nav-link" routerLink="/receitas" routerLinkActive="fw-semibold"
          [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Todas</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/minhas-receitas" routerLinkActive="fw-semibold"
          ariaCurrentWhenActive="page">Minhas Receitas</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/mensagens" routerLinkActive="fw-semibold"
          ariaCurrentWhenActive="page">Mensagens</a></li>
        @if (usuario.papel === 'ADMIN') {
          <li class="nav-item"><a class="nav-link" routerLink="/categorias" routerLinkActive="fw-semibold"
            ariaCurrentWhenActive="page">Categorias</a></li>
        }
      </ul>
      <details class="menu-conta">
        <summary>{{ usuario.nomeUsuario }}</summary>
        <div class="menu-conta-opcoes">
          <button class="btn btn-outline-secondary" type="button" (click)="sair()">Sair da conta</button>
        </div>
      </details>
    } @else {
      <div class="acoes">
        <a class="btn btn-outline-secondary" routerLink="/entrar">Entrar</a>
        <a class="btn btn-primary" routerLink="/cadastro">Criar conta</a>
      </div>
    }
  </nav>
</header>
<main class="container conteudo">
  @if (falhaAoSair()) {
    <p class="alert alert-danger" role="alert">Não foi possível sair da conta. Tente novamente.</p>
  }
  <router-outlet />
</main>
