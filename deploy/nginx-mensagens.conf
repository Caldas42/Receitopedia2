resolver 127.0.0.11 valid=3s ipv6=off;

upstream receitopedia_web {
    zone receitopedia_web 64k;
    server receitopedia:8080 resolve max_fails=1 fail_timeout=3s;
    server receitopedia-b:8080 resolve max_fails=1 fail_timeout=3s;
}

map $http_upgrade $conexao_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 8080;
    client_max_body_size 27m;

    location = /saude-proxy {
        return 200;
    }

    location / {
        proxy_pass http://receitopedia_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexao_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Receitopedia-No $upstream_addr always;
    }
}
